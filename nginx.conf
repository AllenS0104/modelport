# Local-only ingress for QuantumNous/new-api and the ModelPort frontend.
# No request/access logs, no credentials, no external upstreams.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Use the normalized URI so encoded paths, duplicate slashes and query strings cannot bypass policy.
    map "$request_method:$uri" $self_account_deletion_disabled {
        default 0;
        ~*^DELETE:/api/user/self/?$ 1;
    }
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        error_page 418 = @self_account_deletion_disabled;
        if ($self_account_deletion_disabled) { return 418; }
        location @self_account_deletion_disabled {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            return 403 '{"success":false,"code":"SELF_ACCOUNT_DELETION_DISABLED","message":"Self-service account deletion is disabled. Contact the platform administrator."}';
        }
        # Public visitors land on the product site; native /setup and console routes remain intact.
        location = / { return 302 /h5/; }
        include /srv/modelport-console/routes.conf;
        location ^~ /console-assets/ {
            alias /srv/modelport-console/;
            autoindex off;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
        }
        location = /h5 { return 302 /h5/; }
        location /h5/ {
            alias /srv/h5/;
            index index.html;
            autoindex off;
            types { text/html html; application/javascript js; }
            default_type application/octet-stream;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-SF5jJmZCtRSxdgbZBMFzmn/1+5c+uN3lDUp2R0fx7Yc='; style-src 'sha256-T1KAoXnvyTBjp1W5n1jZ7B5TqCVglm5aaPMkKtLQt8Y='; img-src data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        }
        # Isolated read-only preview; no API proxy inside this prefix.
        location = /preview { return 302 /preview/; }
        location ^~ /preview/ {
            alias /srv/h5-preview/;
            index index.html;
            autoindex off;
            types { text/html html; }
            default_type application/octet-stream;
            limit_except GET HEAD { deny all; }
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-HuoMghwnei+3Y1zdljkoh68eiuZlwmo7Xw2jK65sW9w='; style-src 'sha256-zS4S0uJbVNDE9DVSlnNZXPJnbH5P4xhUqNArTtIyuTI='; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        }
        location / {
            proxy_pass http://new-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_read_timeout 180s;
        }
    }
}
